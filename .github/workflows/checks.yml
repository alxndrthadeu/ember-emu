name: Checks

on:
  pull_request:
  push:
    branches: [main]

jobs:
  checks:
    # The app needs the engine (hours to build), so CI runs the quick
    # checks; the app and EmberTests are built and tested on the Mac.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
      - run: scripts/check.sh
